<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoveX Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* ===== LOGIN PAGE — WHITE / AESTHETIC REDESIGN ===== */
        /* Uses the same brand tokens as the main site (navy / orange / off-white)
           but built on a light background instead of the old dark card. */

        .login-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
            background: var(--off-white, #f4f6fb);
        }

        /* LEFT SIDE — light, airy brand panel */
        .login-left {
            width: 50%;
            position: relative;
            background:
                radial-gradient(ellipse 70% 60% at 20% 20%, rgba(249, 115, 22, 0.10), transparent 60%),
                radial-gradient(ellipse 60% 60% at 80% 80%, rgba(10, 22, 40, 0.06), transparent 60%),
                url('https://images.unsplash.com/photo-1519003722824-194d4455a60c?q=80&w=1974&auto=format&fit=crop') center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(244, 246, 251, 0.88);
            backdrop-filter: blur(2px);
        }

        .brand-content {
            position: relative;
            z-index: 2;
            color: var(--navy, #0a1628);
            text-align: center;
            animation: fadeIn 1.2s ease;
            padding: 0 40px;
        }

        .brand-content .logo-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: var(--orange, #f97316);
            border-radius: 16px;
            display: grid;
            place-items: center;
            box-shadow: 0 12px 30px rgba(249, 115, 22, 0.35);
        }

        .brand-content .logo-badge i {
            font-size: 28px;
            color: white;
        }

        .brand-content h1 {
            font-family: 'Inter', sans-serif;
            font-size: 46px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--navy, #0a1628);
            letter-spacing: -0.02em;
        }

        .brand-content h1 span {
            color: var(--orange, #f97316);
        }

        .brand-content p {
            font-size: 16px;
            margin-bottom: 40px;
            color: var(--gray-dark, #3d4f6a);
        }

        .features {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 600;
            color: var(--navy, #0a1628);
            background: white;
            border: 1px solid var(--gray-light, #e8ecf3);
            padding: 12px 22px;
            border-radius: 50px;
            box-shadow: 0 4px 16px rgba(10, 22, 40, 0.06);
            animation: slideUp 1s ease;
            min-width: 220px;
        }

        .feature i {
            color: var(--orange, #f97316);
            font-size: 18px;
        }

        /* RIGHT SIDE */
        .login-right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            padding: 40px;
        }

        .login-box {
            width: 400px;
            max-width: 100%;
            background: white;
            border: 1px solid var(--gray-light, #e8ecf3);
            padding: 44px;
            border-radius: 20px;
            color: var(--navy, #0a1628);
            box-shadow: 0 20px 60px rgba(10, 22, 40, 0.08);
            animation: fadeIn 1s ease;
        }

        .login-box h2 {
            font-family: 'Inter', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--navy, #0a1628);
        }

        .sub-text {
            color: var(--gray-dark, #3d4f6a);
            margin-bottom: 28px;
            font-size: 14px;
        }

        /* Google button — Google's own brand look, sits well on a white theme */
        .google-btn {
            width: 100%;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: white;
            border: 1.5px solid var(--gray-light, #e8ecf3);
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text, #1a2740);
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 24px;
        }

        .google-btn:hover {
            border-color: var(--gray, #8a9ab5);
            box-shadow: 0 4px 14px rgba(10, 22, 40, 0.08);
            transform: translateY(-1px);
        }

        .google-btn img {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            color: var(--gray, #8a9ab5);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-light, #e8ecf3);
        }

        .input-group {
            width: 100%;
            height: 54px;
            background: var(--off-white, #f4f6fb);
            border: 1.5px solid var(--gray-light, #e8ecf3);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 18px;
            transition: all 0.25s ease;
        }

        .input-group:focus-within {
            border-color: var(--orange, #f97316);
            background: white;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.14);
        }

        .input-group i {
            color: var(--orange, #f97316);
            margin-right: 12px;
            width: 18px;
            text-align: center;
        }

        .input-group input {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: var(--text, #1a2740);
            font-size: 15px;
            font-family: inherit;
        }

        .input-group input::placeholder {
            color: var(--gray, #8a9ab5);
        }

        .login-btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            background: var(--orange, #f97316);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 4px;
            box-shadow: 0 8px 24px rgba(249, 115, 22, 0.3);
        }

        .login-btn:hover {
            background: var(--orange-dark, #ea6c0a);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(249, 115, 22, 0.4);
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: var(--gray-dark, #3d4f6a);
            font-size: 14px;
        }

        .signup-text a {
            color: var(--orange, #f97316);
            text-decoration: none;
            font-weight: 700;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .login-left { display: none; }
            .login-right { width: 100%; }
            .login-box { width: 100%; padding: 32px; }
        }
    </style>
</head>

<body>

    <div class="login-page">

        <!-- LEFT SIDE -->
        <div class="login-left">
            <div class="overlay"></div>
            <div class="brand-content">
                <div class="logo-badge"><i class="fa-solid fa-truck-fast"></i></div>
                <h1>Move<span>X</span></h1>
                <p>Smart Transportation & Logistics Platform</p>

                <div class="features">
                    <div class="feature"><i class="fa-solid fa-truck-fast"></i><span>Fast Delivery</span></div>
                    <div class="feature"><i class="fa-solid fa-location-dot"></i><span>Live Tracking</span></div>
                    <div class="feature"><i class="fa-solid fa-shield-halved"></i><span>Secure Transport</span></div>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">
            <div class="login-box">

                <h2>Welcome back 👋</h2>
                <p class="sub-text">Login to continue your MoveX journey</p>

                <!-- Google Sign-In -->
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                     data-callback="handleGoogleCredential"
                     data-auto_prompt="false">
                </div>

                <button type="button" class="google-btn" onclick="triggerGoogleLogin()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                    Continue with Google
                </button>

                <div class="divider">or login with email</div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter Email">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter Password">
                </div>

                <button class="login-btn" onclick="loginUser()">Login</button>

                <p class="signup-text" style="margin-top:14px;">
                    <a href="forgot-password.html">🔐 Forgot Password?</a>
                </p>

                <p class="signup-text">
                    Don't have account? <a href="signup.html">Create Account</a>
                </p>

            </div>
        </div>

    </div>

    <script>
        // Renders the hidden Google button in a fixed size, then we trigger it
        // programmatically from our own styled button above.
        window.onload = function () {
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
                    callback: handleGoogleCredential
                });
            }
        };

        function triggerGoogleLogin() {
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.prompt(); // shows the One Tap / account chooser
            } else {
                alert("Google Sign-In is still loading, please try again in a second.");
            }
        }

        // Called by Google after the user picks an account.
        // response.credential is a signed JWT (id_token) — send it to your
        // backend (Auth.js) to verify it and log the user in / create an account.
        function handleGoogleCredential(response) {
            console.log("Google credential received:", response.credential);

            // Example of what to do next inside Auth.js:
            // fetch('/api/auth/google', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({ credential: response.credential })
            // })
            // .then(res => res.json())
            // .then(data => { window.location.href = 'dashboard.html'; })
            // .catch(err => console.error(err));

            if (typeof handleGoogleLogin === "function") {
                // Delegates to Auth.js if it defines this function
                handleGoogleLogin(response);
            }
        }
    </script>

    <script src="js/Auth.js"></script>

</body>

</html>
